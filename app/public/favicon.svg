<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- The app's mark (D48): PintGauge's nonic pint, nearly full, on stout under the pub lamp.
       People are caps; the app is the pint everyone fills. A rounded tile for "any" icons and
       the favicon. Rendered by app/scripts/make-icons.ps1. -->
  <defs>
    <radialGradient id="lamp" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#f5b23a" stop-opacity=".32"/>
      <stop offset=".65" stop-color="#f5b23a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/><stop offset=".18" stop-color="#f5b23a"/>
      <stop offset=".7" stop-color="#d48d1e"/><stop offset="1" stop-color="#9a5a0b"/>
    </linearGradient>
    <linearGradient id="round" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".32"/><stop offset=".28" stop-color="#000" stop-opacity="0"/>
      <stop offset=".62" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#000" stop-opacity=".38"/>
    </linearGradient>
    <radialGradient id="pool"><stop offset="0" stop-color="#f5b23a" stop-opacity=".55"/><stop offset="1" stop-color="#f5b23a" stop-opacity="0"/></radialGradient>
    <clipPath id="glass"><path d="M25 11 L135 11 C139 21 142.5 31 141 44 L119.5 208 L40.5 208 L19 44 C17.5 31 21 21 25 11 Z"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="#161009"/>
  <rect width="512" height="512" rx="112" fill="url(#lamp)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#f5b23a" stroke-opacity=".16" stroke-width="4"/>

  <g transform="translate(136 82) scale(1.5)">
    <ellipse cx="80" cy="224" rx="78" ry="14" fill="url(#pool)"/>
    <g clip-path="url(#glass)">
      <g transform="translate(0 46)">
        <rect width="160" height="200" fill="url(#beer)"/>
        <rect width="160" height="200" fill="url(#round)"/>
        <rect y="-11" width="160" height="13" fill="#f1e3c2"/>
        <g fill="#fffaf0">
          <circle cx="8" cy="-11" r="6"/><circle cx="22" cy="-10" r="8"/><circle cx="37" cy="-9" r="7"/>
          <circle cx="51" cy="-11" r="6"/><circle cx="66" cy="-10" r="8"/><circle cx="80" cy="-9" r="7"/>
          <circle cx="95" cy="-11" r="6"/><circle cx="109" cy="-10" r="8"/><circle cx="124" cy="-9" r="7"/>
          <circle cx="138" cy="-11" r="6"/><circle cx="152" cy="-10" r="8"/>
        </g>
      </g>
      <g fill="#fff6dd"><circle cx="62" cy="120" r="3" opacity=".7"/><circle cx="92" cy="152" r="2.4" opacity=".6"/><circle cx="74" cy="178" r="1.8" opacity=".5"/></g>
    </g>
    <path d="M20 6 L140 6 C145 18 149 30 147 44 L124 216 C123.4 220 121 222 117 222 L43 222 C39 222 36.6 220 36 216 L13 44 C11 30 15 18 20 6 Z"
          fill="none" stroke="#fbf4e4" stroke-opacity=".4" stroke-width="3" stroke-linejoin="round"/>
    <path d="M27 18 C24 40 30 120 44 200" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
